[package]
name = "cinebox-player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "libmpv2 playback via the OpenGL render API"

[dependencies]
cinebox-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
libmpv2 = { version = "6.0.0", features = ["build_libmpv"] }

[target.'cfg(target_os = "linux")'.dependencies]
libmpv2 = "6.0.0"

[target.'cfg(target_os = "android")'.dependencies]
libmpv2 = "6.0.0"

[build-dependencies]
cc = "1.2"
goblin = { version = "0.10", default-features = false, features = ["std", "pe64"] }
pkg-config = "0.3"
sevenz-rust2 = "0.22"
sha2 = "0.11"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
