[package]
name = "cinebox-player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "libmpv2 playback via the OpenGL render API"

[dependencies]
cinebox-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
libmpv2 = { version = "6.0.0", features = ["build_libmpv"] }

[target.'cfg(not(windows))'.dependencies]
libmpv2 = "6.0.0"

[build-dependencies]
cc = "1.2"
goblin = { version = "0.10", default-features = false, features = ["std", "pe64"] }
sevenz-rust2 = "0.22"
sha2 = "0.11"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[lints]
workspace = true
