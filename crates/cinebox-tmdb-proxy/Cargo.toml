[package]
name = "cinebox-tmdb-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Self-hostable caching reverse proxy for the TMDB API and images"

[[bin]]
name = "cinebox-tmdb-proxy"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", default-features = false }
blake3 = "1.8.7"
bytes = "1.12.2"
cinebox-net.workspace = true
clap = { version = "4.6.8", features = ["derive", "env"] }
flate2 = "1.1.11"
fs4 = { version = "1.1.0", default-features = false }
futures-util.workspace = true
governor = { version = "0.10.4", default-features = false, features = ["std", "dashmap", "quanta"] }
http = "1.5.0"
humantime = "2.4.0"
hyper = { version = "1.12.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "server-graceful", "tokio"] }
memchr = "2.8.3"
mimalloc = { version = "0.1.52", default-features = false }
moka = { version = "0.12.16", features = ["future", "sync"] }
reqwest.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "macros", "signal", "fs", "sync", "io-util"] }
tower-service = "0.3.3"
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
