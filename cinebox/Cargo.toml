[package]
name = "cinebox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native desktop movie theater"

[dependencies]
cinebox-core.workspace = true
cinebox-indexer.workspace = true
cinebox-net.workspace = true
cinebox-skip.workspace = true
cinebox-tmdb.workspace = true
cinebox-torrserver.workspace = true
cinebox-player.workspace = true
cinebox-youtube.workspace = true
rust-i18n = "4"
egui.workspace = true
eframe.workspace = true
egui_extras.workspace = true
egui_glow.workspace = true
egui_material_icons.workspace = true
egui-async.workspace = true
tokio.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }

[build-dependencies]
anyhow.workspace = true
ico = "0.5.0"
resvg = "0.48.1"
winresource = "0.1"

[dev-dependencies]
egui_kittest.workspace = true

[lints]
workspace = true

# `cargo deb -p cinebox`; dependencies come from dpkg-shlibdeps (libmpv2 and friends).
[package.metadata.deb]
maintainer = "dexsper <dexsperpro@gmail.com>"
copyright = "dexsper"
section = "video"
priority = "optional"
depends = "$auto"
extended-description = """\
Movie and series catalog from TMDB, torrent search through Jackett or \
Prowlarr, and playback through TorrServer and mpv in one native window."""
assets = [
    ["target/release/cinebox", "usr/bin/", "755"],
    ["../packaging/linux/io.github.dexsper.cinebox.desktop", "usr/share/applications/", "644"],
    ["../packaging/linux/io.github.dexsper.cinebox.metainfo.xml", "usr/share/metainfo/", "644"],
    ["assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/io.github.dexsper.cinebox.svg", "644"],
    ["../README.md", "usr/share/doc/cinebox/", "644"],
    ["../THIRD_PARTY_NOTICES", "usr/share/doc/cinebox/", "644"],
]
